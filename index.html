<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет рабочих часов</title>
    <!-- Подключаем официальный стиль Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--tg-theme-hint-color, #888888);
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .result {
            margin-top: 16px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Учет смены</h2>

    <div class="card">
        <label for="startTime">Время начала смены:</label>
        <input type="time" id="startTime">

        <label for="endTime">Время окончания смены:</label>
        <input type="time" id="endTime">

        <label for="breakTime">Перерыв (в минутах):</label>
        <input type="number" id="breakTime" value="0" min="0">

        <button onclick="calculateHours()">Рассчитать часы</button>
    </div>

    <div class="result" id="resultText"></div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        function calculateHours() {
            let start = document.getElementById('startTime').value;
            let end = document.getElementById('endTime').value;
            let breakMinutes = parseInt(document.getElementById('breakTime').value) || 0;

            if (!start || !end) {
                document.getElementById('resultTextinnerText = "Пожалуйста, введите время начала и конца."';
                return;
            }

            // Переводим время в минуты от начала суток
            let [startHour, startMin] = start.split(':').map(Number);
            let [endHour, endMin] = end.split(':').map(Number);

            let startTotalMin = startHour * 60 + startMin;
            let endTotalMin = endHour * 60 + endMin;

            // Если смена перешла через полночь
            if (endTotalMin < startTotalMin) {
                endTotalMin += 24 * 60;
            }

            let diffMin = (endTotalMin - startTotalMin) - breakMinutes;

            if (diffMin < 0) {
                document.getElementById('resultText').innerText = "Ошибка: перерыв больше времени смены!";
                return;
            }

            let hours = Math.floor(diffMin / 60);
            let minutes = diffMin % 60;

            document.getElementById('resultText').innerText = Итого отработано: ${hours} ч. ${minutes} мин.;
        }
    </script>
</body>
</html>
